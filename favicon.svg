<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e23636" />
      <stop offset="100%" stop-color="#b01017" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#14120f" flood-opacity="1"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="16" fill="url(#shieldGrad)" stroke="#14120f" stroke-width="5" filter="url(#shadow)"/>
  
  <!-- Subtle inner border for comic look -->
  <rect x="11" y="11" width="78" height="78" rx="11" fill="none" stroke="#fbf7ec" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Stylized M -->
  <path d="M22 75 V28 L38 52 L50 36 L62 52 L78 28 V75 H66 V46 L54 62 H46 L34 46 V75 Z" fill="#ffffff" stroke="#14120f" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Golden Indian Star accent in corner -->
  <polygon points="50,14 52.5,20 59,20.5 54,24.5 56,31 50,27 44,31 46,24.5 41,20.5 47.5,20" fill="#ffd700" stroke="#14120f" stroke-width="1.2"/>
</svg>
