<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <pattern id="halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#e23636" opacity="0.15" />
    </pattern>
  </defs>
  <rect width="400" height="600" fill="url(#bg)" />
  <rect width="400" height="600" fill="url(#halftone)" />
  <rect x="12" y="12" width="376" height="576" fill="none" stroke="#e23636" stroke-width="4" stroke-opacity="0.8" />
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#fbf7ec" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4,4" />

  <!-- Marvel Header Badge -->
  <rect x="120" y="36" width="160" height="42" fill="#e23636" />
  <text x="200" y="66" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#ffffff" font-weight="900" letter-spacing="3" text-anchor="middle">MARVEL</text>

  <!-- Center Emblem -->
  <circle cx="200" cy="270" r="80" fill="#14120f" stroke="#e23636" stroke-width="4" />
  <polygon points="200,210 216,256 264,258 226,288 239,334 200,306 161,334 174,288 136,258 184,256" fill="#e23636" opacity="0.9" />
  
  <text x="200" y="410" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" fill="#fbf7ec" letter-spacing="2" text-anchor="middle">OFFICIAL ARCHIVE</text>
  <rect x="140" y="425" width="120" height="2" fill="#e23636" />
  <text x="200" y="455" font-family="sans-serif" font-size="13" font-weight="700" fill="#a8a29e" letter-spacing="1.5" text-anchor="middle">CLASSIFIED DOSSIER</text>
  <text x="200" y="550" font-family="monospace" font-size="11" fill="#78716c" text-anchor="middle">MARVEL CINEMATIC UNIVERSE</text>
</svg>

